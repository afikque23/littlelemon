{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <!--Begin row-->
    <div class="row">
      <!--Begin col-->
      <div class="column">
          {% csrf_token %}
          <form method="POST" id="form">
            <!-- {% csrf_token %} -->
            <p>
              <label for="first_name">First Name:</label>
              <input type="text" placeholder="Your Name" maxlength="200" required="" id="first_name">
            </p>
            <p>
            <!-- Step 10: Part two -->
              <label for="reservation_date">Reservation Date:</label>
              <input type="date" placeholder="Select Date" required="" id="reservation_date">
            </p>
      
            <p>
              <label for="reservation_slot">Reservation slot:</label>
              <select id="reservation_slot">
                <option value="0" disabled>Select time</option>
              </select>
            </p>
            <button type="button" id="button">Reserve</button>
          </form>
      </div>
      <!--End col-->

      <!--Begin col-->
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">
        </div>
      </div>
      <!--End col-->
    </div>
    <!--End row-->

  </article>
</section>
<script>

  // Exercise 3 / Step 10: Automatically select the current date when opening the booking form
  const date = new Date()
  document.getElementById('reservation_date').value = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`

  console.log(document.getElementById('reservation_date').value)
  getBookings()

  /* Step 10: Part two - Changing date refreshes booking data */
  document.getElementById('reservation_date').addEventListener('change', function () {
    getBookings()
  })

  function getBookings() {
    let reserved_slots = []
    const date = document.getElementById('reservation_date').value
    document.getElementById('today').innerText = date
    
    // Step 11: Using Fetch API to retrieve bookings for the specific date
    fetch("{% url 'bookings' %}" + '?date=' + date)
      .then(r => r.json())
      .then(data => {
        reserved_slots = []
        bookings = ''
        
        /* Step 11: Part three - Loop through bookings data */
        for (let item of data) {
          console.log(item.fields)
          reserved_slots.push(item.fields.reservation_slot)
          bookings += `<p>${item.fields.first_name} - ${formatTime(item.fields.reservation_slot)}</p>`
        }

        /* Step 12: Part four - Disabling duplicate slots so they are unavailable */
        slot_options = '<option value="0" disabled>Select time</option>'
        for (let i = 10; i <= 20; i++) {
          if (reserved_slots.includes(i)) {
            slot_options += `<option value=${i} disabled>${formatTime(i)} (Booked)</option>`
          } else {
            slot_options += `<option value=${i}>${formatTime(i)}</option>`
          }
        }
        
        document.getElementById('reservation_slot').innerHTML = slot_options
        
        // Step 11: If no booking exists, show "No Booking" message
        if (bookings === '') {
          bookings = "No Booking"
        }
        document.getElementById('bookings').innerHTML = bookings
      })
  }

  function formatTime(time) {
    const ampm = time < 12 ? 'AM' : 'PM'
    const t = time < 12 ? time : time > 12 ? time - 12 : time
    const label = `${t} ${ampm}`
    return label
  }

  // Submit booking with Fetch API
  document.getElementById('button').addEventListener('click', function (e) {
    const formdata = {
      first_name: document.getElementById('first_name').value,
      reservation_date: document.getElementById('reservation_date').value,
      reservation_slot: document.getElementById('reservation_slot').value,
    }

    if (!formdata.first_name || !formdata.reservation_date || !formdata.reservation_slot || formdata.reservation_slot == 0) {
      alert("Please fill all fields and select an available time slot.")
      return
    }

    fetch("{% url 'bookings' %}", {
      method: 'post',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formdata)
    })
      .then(r => r.text())
      .then(data => {
        getBookings()
      })
  })
</script>
{% endblock %}
